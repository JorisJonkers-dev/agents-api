name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  jvm-ci:
    name: JVM CI
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@cc3d3af91778b169ee6ad9cbe2f51653bf5c2f0a # v0.17.0
    with:
      gradle-command: ./gradlew
      lint-gradle-args: :api:detektMain :api:detektTest :api:detektIntegrationTest :api:ktlintCheck
      test-gradle-args: :api:test :api:integrationTest :api:jacocoTestCoverageVerification :api:exportOpenApiSpec
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Export OpenAPI spec
        run: ./gradlew :api:exportOpenApiSpec --no-daemon
      - name: Check committed OpenAPI spec
        run: git diff --exit-code -- client-spec/openapi/agents-api.json
      - uses: JorisJonkers-dev/api-contract-checks@f1b324b45e4fadf3be9581c68ad0713b754f3196 # v1.1.0
        with:
          profile: agents-api
          spec-path: client-spec/openapi/agents-api.json
          export-command: ./gradlew :api:exportOpenApiSpec --no-daemon
          guidance: ./gradlew :api:exportOpenApiSpec
      - name: Fetch base OpenAPI spec
        run: git fetch --depth=1 origin ${{ github.base_ref || 'main' }}
      - uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0.1.17
        with:
          base: origin/${{ github.base_ref || 'main' }}:client-spec/openapi/agents-api.json
          revision: HEAD:client-spec/openapi/agents-api.json
          fail-on: WARN

  client-dry-run:
    name: Client Dry Run
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-api-clients.yml@cc3d3af91778b169ee6ad9cbe2f51653bf5c2f0a # v0.17.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      spec-path: client-spec/openapi/agents-api-client.json
      api-name: agents-api
      version: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
      ts-package: '@jorisjonkers-dev/agents-api-client'
      maven-group: dev.jorisjonkers
      java-artifact: agents-api-client-java
      kotlin-artifact: agents-api-client-kotlin
      openapi-client-gradle-version: '0.3.1'
      dry-run: true
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}
      node-auth-token: ${{ secrets.GITHUB_TOKEN }}

  docker-dry-run:
    name: Docker Dry Run
    runs-on: ubuntu-latest
    # The image bakes every Agent Session tool, so a cold build is tens of
    # minutes. The GHA layer cache below keeps the usual PR down to the app
    # layers; the timeout covers the cold build after a tooling-pin bump.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build agents-api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ghcr.io/jorisjonkers-dev/agents-api/agents-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
            github_actor=${{ github.actor }}
          build-args: |
            GIT_SHA=${{ github.sha }}

      # A build that never runs the image passes with a broken ENTRYPOINT, a
      # missing tini or a tool the registry moved. Exercise the two things this
      # image exists for: the tools at their pins, and the api-to-agent hop.
      - name: Smoke-test the image
        env:
          IMAGE: ghcr.io/jorisjonkers-dev/agents-api/agents-api:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/sbin/setup-container.sh \
            --user agent "$IMAGE" --check
          # Go through a shell, not --entrypoint: runc execs an --entrypoint
          # binary before it drops to --user, so the mode-0050 check never
          # applies and the negative case below would pass on any image.
          run() { docker run --rm --entrypoint bash --user "$1" "${@:2}"; }
          got="$(run api --cap-drop ALL --cap-add SETUID --cap-add SETGID "$IMAGE" \
            -lc '/usr/local/lib/agents-api/run-as-agent id -un')"
          [ "$got" = agent ] || { echo "run-as-agent became '$got', not agent" >&2; exit 1; }
          if run agent "$IMAGE" -lc '/usr/local/lib/agents-api/run-as-agent id -un'; then
            echo "agent was able to execute run-as-agent" >&2; exit 1
          fi

  migration-guard:
    name: Migration Guard
    uses: JorisJonkers-dev/github-workflows/.github/workflows/migration-guard.yml@cc3d3af91778b169ee6ad9cbe2f51653bf5c2f0a # v0.17.0
    with:
      migration-regex: '^api/src/main/resources/db/migration/V[0-9][^/]*\.sql$'
      scope-regex: '^(api)/.*'

  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      [
        jvm-ci,
        contract,
        client-dry-run,
        docker-dry-run,
        migration-guard,
      ]
    if: ${{ always() }}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
